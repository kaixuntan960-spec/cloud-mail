name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "biliiant-mail-db"
database_id = "e2f3f240-fed6-433c-bd4d-d9d292a4e76e"

[[kv_namespaces]]
binding = "kv"
id = "ef922521ab57478e8f8645549c93f5fd"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]

[vars]
domain = ["biliiant.top"]
admin = "admin@biliiant.top"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
